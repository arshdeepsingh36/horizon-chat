name: Build Horizon Chat Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_HOME=$(cd "`dirname "$0"`" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Prepare Distribution Files
        run: |
          mkdir -p /tmp/dist
          find . -name "*debug*.apk" -exec cp {} /tmp/dist/app-debug.apk \;
          cp /tmp/dist/app-debug.apk /tmp/dist/horizon-chat-v2.0.1.apk
          ls -la /tmp/dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-chat-apk
          path: /tmp/dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release Asset
        run: |
          gh release create v2.0-latest /tmp/dist/app-debug.apk /tmp/dist/horizon-chat-v2.0.1.apk \
            --title "Horizon Chat v2.0.1 Latest Debug Build" \
            --notes "Horizon Chat v2.0.1 complete build with Video Messaging, Native Document Viewer, Real-Time Presence, and User Profile." \
            --clobber || \
          gh release upload v2.0-latest /tmp/dist/app-debug.apk /tmp/dist/horizon-chat-v2.0.1.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

