name: Build Horizon Chat Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_HOME=$(cd "`dirname "$0"`" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Android APKs (Release & Debug)
        working-directory: ./android
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare Distribution Files
        run: |
          mkdir -p /tmp/dist
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk /tmp/dist/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk /tmp/dist/horizon-chat-v3.2.0.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/dist/app-debug.apk
          fi
          ls -la /tmp/dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-chat-apk
          path: /tmp/dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.ref_type == 'tag' && github.ref_name) || 'v3.2.0' }}
          name: "Horizon Chat v3.2.0 Release"
          body: |
            ## Horizon Chat v3.2.0 Release
            
            ### ✨ What's New:
            - **Real-Time Delivery Receipts & Ticks**: Instant double-tick delivery acknowledgments (`mark_delivered`) across Web & Mobile.
            - **Foreground Silent Sync**: Automatically catches missed messages when app/tab regains focus or reconnects.
            - **Time-Limited 'Delete for Everyone'**: Enforces 60m creation and 7m seen deadlines with server-side validation and clean text erasure.
            - **Web & Mobile Push Notifications**: Background notifications via Web Push & push token registration.
            - **Socket Reconnection Enhancements**: Aggressive exponential retry policy and automatic conversation room rejoining.
          files: |
            /tmp/dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

