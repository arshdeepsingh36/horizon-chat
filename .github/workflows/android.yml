name: Build Horizon Chat Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          # Generate linux executable wrapper
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_HOME=$(cd "`dirname "$0"`" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Show Build Log Summary
        run: |
          echo "=== LAST 40 LINES OF BUILD LOG ==="
          tail -n 40 android/build_output.log
          echo "=== SEARCHING FOR ALL GENERATED APKS ==="
          find . -name "*.apk"

      - name: Prepare Release APK
        run: |
          mkdir -p release_apk
          find . -name "*.apk" -exec cp {} release_apk/app-debug.apk \;
          ls -la release_apk/

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-chat-build-log
          path: android/build_output.log
          retention-days: 7

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-chat-app-debug
          path: release_apk/app-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-latest
          name: "Horizon Chat v2.0 Latest Debug Build"
          body: "Automated latest build containing Phase 2b video messaging pipeline, full-screen media players, and profile repositories."
          files: release_apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
