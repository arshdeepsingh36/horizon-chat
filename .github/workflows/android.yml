name: Build Horizon Chat Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          # Generate linux executable wrapper
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_HOME=$(cd "`dirname "$0"`" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Report Build Error
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-error-log
          cp build.log error.txt
          git add -f error.txt
          git commit -m "ci: dump full build log"
          git push -f origin build-error-log




      - name: Show Generated APK Files
        run: |
          echo "=== SEARCHING FOR ALL GENERATED APKS ==="
          find . -name "*.apk"

      - name: Prepare Release APK
        run: |
          mkdir -p release_apk
          find . -name "*-debug.apk" -not -path "./release_apk/*" -exec cp {} release_apk/app-debug.apk \;
          ls -la release_apk/


      - name: Deploy APK to apk-dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-dist
          mkdir -p apk
          cp release_apk/app-debug.apk apk/app-debug.apk
          git add -f apk/app-debug.apk
          git commit -m "deploy: update app-debug.apk from commit ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-dist

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release_apk/app-debug.apk"
          tag: "v2.0-latest"
          name: "Horizon Chat v2.0 Latest Debug Build"
          body: "Horizon Chat Phase 2b complete build with Video Messaging, Native Document Viewer, Real-Time Presence, and User Profile."
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}


