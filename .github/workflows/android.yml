name: Build Horizon Chat Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          # Generate linux executable wrapper
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_HOME=$(cd "`dirname "$0"`" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Report Build Error
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-error-log
          cp build.log error.txt
          git add -f error.txt
          git commit -m "ci: dump full build log"
          git push -f origin build-error-log




      - name: Show Generated APK Files
        run: |
          echo "=== SEARCHING FOR ALL GENERATED APKS ==="
          find . -name "*.apk"

      - name: Prepare Release APK
        run: |
          mkdir -p release_apk
          find . -name "*-debug.apk" -not -path "./release_apk/*" -exec cp {} release_apk/app-debug.apk \;
          ls -la release_apk/


      - name: Create or Update GitHub Release
        run: |
          gh release delete v2.0-latest --yes --cleanup-tag || true
          git push --delete origin v2.0-latest || true
          gh release create v2.0-latest release_apk/app-debug.apk --title "Horizon Chat v2.0 Latest Debug Build" --notes "Horizon Chat Phase 2b complete build with Video Messaging, Native Document Viewer, Real-Time Presence, and User Profile." --clobber || gh release upload v2.0-latest release_apk/app-debug.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


