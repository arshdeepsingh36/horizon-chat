name: Build Horizon Chat Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_HOME=$(cd "`dirname "$0"`" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Distribution Files
        run: |
          mkdir -p /tmp/dist
          cp android/app/build/outputs/apk/debug/*.apk /tmp/dist/app-debug.apk
          cp /tmp/dist/app-debug.apk /tmp/dist/horizon-chat-v3.0.0.apk
          ls -la /tmp/dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-chat-apk
          path: /tmp/dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v3.0-latest' }}
          name: "Horizon Chat v3.0.0 Phase 3 Release"
          body: "Horizon Chat v3.0.0 featuring Cloudflare R2 Direct Media Storage, Permanent Media Retention, Multi-Format Attachments (Photos, Videos, Audio Notes, Documents), 1-View Mode, and Muted High-Contrast Professional Theme."
          files: |
            /tmp/dist/app-debug.apk
            /tmp/dist/horizon-chat-v3.0.0.apk
          token: ${{ secrets.GITHUB_TOKEN }}

