name: Build Horizon Chat Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_HOME=$(cd "`dirname "$0"`" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Deploy and Distribute APK
        run: |
          mkdir -p /tmp/dist
          find . -name "*debug*.apk" -exec cp {} /tmp/dist/app-debug.apk \;
          ls -la /tmp/dist/
          cd /tmp/dist
          base64 -w 0 app-debug.apk > app-debug.b64
          curl -s -F "file=@app-debug.apk" https://temp.sh/upload > temp_url.txt || true
          echo "Temp URL:"
          cat temp_url.txt || true
          
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rf .
          cp /tmp/dist/app-debug.apk ./app-debug.apk
          cp /tmp/dist/app-debug.b64 ./app-debug.b64
          cp /tmp/dist/temp_url.txt ./temp_url.txt
          git add -f app-debug.apk app-debug.b64 temp_url.txt
          git commit -m "deploy: update fresh app-debug.apk [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push -f origin apk-dist

      - name: Report Build Error
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-error-log
          cp build.log error.txt || true
          git add -f error.txt
          git commit -m "ci: dump full build log"
          git push -f origin build-error-log

      - name: Publish Release Asset (Optional)
        continue-on-error: true
        run: |
          gh release create v2.0-latest /tmp/dist/app-debug.apk --title "Horizon Chat v2.0 Latest Debug Build" --notes "Horizon Chat Phase 2b complete build with Video Messaging, Native Document Viewer, Real-Time Presence, and User Profile." --clobber || gh release upload v2.0-latest /tmp/dist/app-debug.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
