name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Publish Release to GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Horizon Chat ${{ github.ref_name }} Release"
          body: |
            ## Horizon Chat ${{ github.ref_name }}
            
            ### ✨ What's New:
            - **Message Deduplication / Loop Fix**: Fixed message duplication and infinite loops on history loading.
            - **Background Push Notifications**: Configured push handler body to "Update....." when the app is closed.
            - **View-Once Media Access**: Restricted viewing permissions so only the recipient can tap and view view-once photos/videos.
            - **Full Reply Preview**: Removed reply preview truncation so the entire replied message is visible.
            - **Reply Jump & 1-Second Highlight**: Tapping a quoted message smoothly scrolls and pulses a 1-second highlight.
            - **Message Reactions Sync**: Full real-time socket synchronization for message reactions and picker across devices.
            - **Bubble Width**: Enforced 80% maximum width on chat bubbles.
            - **Deleted Message Text**: Formatted "This message was deleted" in italics.
          files: |
            apk/app-release.apk
            apk/horizon-chat-v3.2.1.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
